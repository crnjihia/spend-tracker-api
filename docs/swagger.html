<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spend Tracker API - Swagger UI</title>
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui.css">
  <link rel="icon" type="image/png" href="https://fastapi.tiangolo.com/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .top-nav {
      background: rgba(22, 27, 34, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #30363d;
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: #f0f6fc;
      font-weight: 700;
      font-size: 1.1rem;
    }
    .brand-badge {
      background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
      color: #041014;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 9999px;
      letter-spacing: 0.05em;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .nav-btn {
      color: #8b949e;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .nav-btn:hover {
      color: #f0f6fc;
      background: #21262d;
    }
    .nav-btn.active {
      color: #58a6ff;
      background: rgba(56, 139, 253, 0.15);
      border: 1px solid rgba(56, 139, 253, 0.3);
    }
    .download-pill {
      background: #238636;
      color: #ffffff !important;
      font-weight: 600;
    }
    .download-pill:hover {
      background: #2ea043 !important;
    }
    /* Swagger container dark tweaks */
    #swagger-ui {
      max-width: 1300px;
      margin: 0 auto;
      padding: 1.5rem;
    }
    .swagger-ui {
      filter: invert(88%) hue-rotate(180deg);
    }
    .swagger-ui .topbar {
      display: none !important;
    }
  </style>
</head>
<body>
  <header class="top-nav">
    <a href="index.html" class="brand">
      <span>🇰🇪 Spend Tracker API</span>
      <span class="brand-badge">v0.1.0</span>
    </a>
    <nav class="nav-links">
      <a href="index.html" class="nav-btn">🏠 Portal</a>
      <a href="swagger.html" class="nav-btn active">⚡ Swagger UI</a>
      <a href="redoc.html" class="nav-btn">📖 ReDoc</a>
      <a href="coverage/index.html" class="nav-btn">🧪 Coverage</a>
      <a href="openapi.json" download class="nav-btn download-pill">⬇️ openapi.json</a>
    </nav>
  </header>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function() {
      SwaggerUIBundle({
        url: "./openapi.json",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout",
        defaultModelsExpandDepth: 2,
        defaultModelExpandDepth: 2,
        docExpansion: "list",
        filter: true,
        showExtensions: true,
        showCommonExtensions: true
      });
    };
  </script>
</body>
</html>
