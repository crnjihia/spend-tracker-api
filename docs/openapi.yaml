                title: Response List Transactions Transactions Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /transactions/{transaction_id}:
    get:
      tags:
      - Transactions
      summary: Get transaction by ID
      description: Retrieve a single transaction if owned by the authenticated user.
      operationId: get_transaction_transactions__transaction_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: transaction_id
        in: path
        required: true
        schema:
          type: string
          title: Transaction Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /budgets:
    get:
      tags:
      - Budgets
      summary: List user budgets
      description: Retrieve all budgets created by the authenticated user.
      operationId: list_budgets_budgets_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BudgetRead'
                type: array
                title: Response List Budgets Budgets Get
      security:
      - HTTPBearer: []
    post:
      tags:
      - Budgets
      summary: Create category budget
      description: Establish a monthly spending limit for a specific category and
        period (YYYY-MM).
      operationId: create_budget_budgets_post
