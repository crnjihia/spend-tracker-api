  /:
    get:
      tags:
      - Root
      summary: API Root
      description: Root endpoint providing service details and documentation links.
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Root  Get
  /health:
    get:
      tags:
      - Health
      summary: Service health check
      description: Verify service availability and database connectivity.
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    BudgetCreate:
      properties:
        category_id:
          type: string
          title: Category Id
          description: Target category UUID
        monthly_limit:
          type: number
          exclusiveMinimum: 0.0
          title: Monthly Limit
          description: Spending limit for the period
          examples:
          - 10000.0
        alert_webhook_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Alert Webhook Url
          description: Webhook URL triggered when budget exceeded
          examples:
          - https://webhook.site/alert
        period:
          type: string
          title: Period
          description: Budget period in YYYY-MM format
          examples:
          - 2025-01
      type: object
      required:
      - category_id
      - monthly_limit
      - period
      title: BudgetCreate
      description: Payload to establish a category budget for a monthly period.
    BudgetRead:
      properties:
        id:
          type: string
          title: Id
        user_id:
          type: string
          title: User Id
        category_id:
          type: string
          title: Category Id
        monthly_limit:
          type: number
          title: Monthly Limit
        alert_webhook_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Alert Webhook Url
        period:
          type: string
          title: Period
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - user_id
      - category_id
      - monthly_limit
      - period
      - created_at
      title: BudgetRead
      description: Serialized budget representation.
    BudgetUpdate:
      properties:
        monthly_limit:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Monthly Limit
          description: New spending limit
        alert_webhook_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Alert Webhook Url
          description: New webhook URL
      type: object
      title: BudgetUpdate
      description: Payload to update an existing budget.
    DailySpend:
      properties:
        date:
          type: string
          title: Date
        amount:
          type: number
          title: Amount
      type: object
      required:
      - date
      - amount
      title: DailySpend
      description: Daily spend aggregation.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LoginRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
          description: Registered email address
          examples:
          - alice@example.com
        password:
          type: string
          title: Password
          description: User password
          examples:
          - SecureP@ss123
      type: object
      required:
      - email
      - password
      title: LoginRequest
      description: Payload for user login.
    LogoutRequest:
      properties:
        refresh_token:
          type: string
          title: Refresh Token
          description: Refresh token to revoke
      type: object
      required:
      - refresh_token
      title: LogoutRequest
      description: Payload for logging out and revoking a refresh token.
    MerchantSpend:
      properties:
        merchant:
          type: string
          title: Merchant
        amount:
          type: number
          title: Amount
      type: object
      required:
      - merchant
      - amount
      title: MerchantSpend
      description: Spend aggregation per merchant.
    MpesaIngestionPayload:
      properties:
        TransID:
          type: string
          title: Transid
          description: Unique M-Pesa transaction reference code
          examples:
          - QGH7XYZ123
        TransAmount:
          type: string
          title: Transamount
          description: Transaction amount as string
          examples:
          - '1500.00'
        BusinessShortCode:
          type: string
          title: Businessshortcode
          description: Paybill or Till Number
          examples:
          - '247247'
        BillRefNumber:
          type: string
          title: Billrefnumber
          description: Account or reference number
          examples:
          - SACCO001
        MSISDN:
          type: string
          title: Msisdn
          description: Customer mobile number in MSISDN format
          examples:
          - '254712345678'
        TransTime:
          type: string
          title: Transtime
          description: Timestamp in YYYYMMDDHHMMSS format
          examples:
          - '20250115143022'
        FirstName:
          type: string
          title: Firstname
          description: Sender or receiver name
          examples:
          - John
      type: object
      required:
      - TransID
      - TransAmount
      - BusinessShortCode
      - BillRefNumber
      - MSISDN
      - TransTime
      - FirstName
      title: MpesaIngestionPayload
      description: Raw M-Pesa C2B or SMS-parsed callback payload.
      example:
        BillRefNumber: SACCO001
        BusinessShortCode: '247247'
        FirstName: John
        MSISDN: '254712345678'
        TransAmount: '1500.00'
        TransID: QGH7XYZ123
        TransTime: '20250115143022'
    RefreshRequest:
      properties:
        refresh_token:
          type: string
          title: Refresh Token
          description: Current valid refresh token
      type: object
      required:
      - refresh_token
      title: RefreshRequest
      description: Payload for refreshing an access token using a refresh token.
    RegisterRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
          description: User's unique email address
          examples:
          - alice@example.com
        password:
          type: string
          minLength: 8
          title: Password
          description: Password (at least 8 characters)
          examples:
          - SecureP@ss123
        full_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Full Name
          description: Full name of user
          examples:
          - Alice Wanjiku
      type: object
      required:
      - email
      - password
      title: RegisterRequest
      description: Payload for user registration.
    RegisterResponse:
      properties:
        id:
          type: string
          title: Id
        email:
          type: string
          format: email
          title: Email
        full_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Full Name
        role:
          type: string
          title: Role
        is_active:
          type: boolean
          title: Is Active
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - email
      - role
      - is_active
      - created_at
      title: RegisterResponse
      description: Response returned upon successful registration.
    SummaryReport:
      properties:
        from_date:
          type: string
          format: date
          title: From Date
          description: Start of reporting window
        to_date:
          type: string
          format: date
          title: To Date
          description: End of reporting window
        totals_by_category:
          additionalProperties:
            type: number
          type: object
          title: Totals By Category
          description: Aggregated spend per category slug
          examples:
          - groceries: 12500.0
            utilities: 3200.0
        top_merchants:
          items:
            $ref: '#/components/schemas/MerchantSpend'
          type: array
          title: Top Merchants
          description: Top 10 merchants by spend
          examples:
          - - amount: 8500.0
              merchant: Naivas Supermarket
        month_over_month_delta:
          type: number
          title: Month Over Month Delta
          description: Difference in spend compared to previous month period
          examples:
          - 1250.0
        daily_spend_series:
          items:
            $ref: '#/components/schemas/DailySpend'
          type: array
          title: Daily Spend Series
          description: Daily spending time series
          examples:
          - - amount: 1500.0
              date: '2025-01-15'
      type: object
      required:
      - from_date
      - to_date
      - month_over_month_delta
      title: SummaryReport
      description: Comprehensive spending summary report for a user.
    TokenResponse:
      properties:
        access_token:
          type: string
          title: Access Token
          description: Short-lived JWT access token (15 mins)
        refresh_token:
          type: string
          title: Refresh Token
          description: Long-lived JWT refresh token (7 days)
        token_type:
          type: string
          title: Token Type
          description: Token authentication type
          default: bearer
      type: object
      required:
      - access_token
      - refresh_token
      title: TokenResponse
      description: JWT token pair returned upon successful authentication or rotation.
    TransactionRead:
      properties:
        id:
          type: string
          title: Id
        account_id:
          type: string
          title: Account Id
        amount:
          type: number
          title: Amount
        category_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Category Id
        merchant:
          anyOf:
          - type: string
          - type: 'null'
          title: Merchant
        ref_code:
          type: string
          title: Ref Code
        occurred_at:
          type: string
          format: date-time
          title: Occurred At
        direction:
          type: string
          title: Direction
        raw_payload:
          additionalProperties: true
          type: object
          title: Raw Payload
        created_at:
          type: string
          format: date-time
          title: Created At
        needs_review:
          type: boolean
          title: Needs Review
      type: object
      required:
      - id
      - account_id
      - amount
      - ref_code
      - occurred_at
      - direction
      - raw_payload
      - created_at
      - needs_review
      title: TransactionRead
      description: Serialized transaction response representation.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
servers:
- url: http://127.0.0.1:8000
  description: Local Development Server
