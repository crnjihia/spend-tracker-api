openapi: 3.1.0
info:
  title: Spend Tracker API
  description: Personal finance tracking REST API built for Kenyan spending habits.
    Handles M-Pesa transactions, SACCO contributions, utility bills, and budgets.
  version: 0.1.0
paths:
  /api/v1/auth/register:
    post:
      tags:
      - Authentication
      summary: Register new user
      description: Register a new personal user account with email, password, and
        automatic M-Pesa wallet setup.
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: Login user
      description: Authenticate with email and password to receive access (15 min)
        and refresh (7 days) tokens.
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/refresh:
    post:
      tags:
      - Authentication
      summary: Rotate refresh token
      description: Present an unrevoked refresh token to receive a brand-new token
        pair. The old token is invalidated.
      operationId: refresh_api_v1_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication
      summary: Logout user
      description: Revoke the provided refresh token so it can no longer be used for
        token rotation.
      operationId: logout_api_v1_auth_logout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/transactions/mpesa:
    post:
      tags:
      - Transactions
      summary: Ingest M-Pesa transaction
      description: Ingest, normalize, and auto-categorize an M-Pesa C2B or SMS confirmation
        payload. Reject duplicates.
      operationId: ingest_mpesa_api_v1_transactions_mpesa_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MpesaIngestionPayload'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/transactions:
    get:
      tags:
      - Transactions
      summary: List transactions
      description: Retrieve paginated list of transactions for the authenticated user.
      operationId: list_transactions_api_v1_transactions_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionRead'
                title: Response List Transactions Api V1 Transactions Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/transactions/{transaction_id}:
    get:
      tags:
      - Transactions
      summary: Get transaction by ID
      description: Retrieve a single transaction if owned by the authenticated user.
      operationId: get_transaction_api_v1_transactions__transaction_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: transaction_id
        in: path
        required: true
        schema:
          type: string
          title: Transaction Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/budgets:
    get:
      tags:
      - Budgets
      summary: List user budgets
      description: Retrieve all budgets created by the authenticated user.
      operationId: list_budgets_api_v1_budgets_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BudgetRead'
                type: array
                title: Response List Budgets Api V1 Budgets Get
      security:
      - HTTPBearer: []
    post:
      tags:
      - Budgets
      summary: Create category budget
      description: Establish a monthly spending limit for a specific category and
        period (YYYY-MM).
      operationId: create_budget_api_v1_budgets_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/budgets/{budget_id}:
    get:
      tags:
      - Budgets
      summary: Get budget by ID
      description: Retrieve details of a single budget owned by the current user.
      operationId: get_budget_api_v1_budgets__budget_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: budget_id
        in: path
        required: true
        schema:
          type: string
          title: Budget Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Budgets
      summary: Update budget
      description: Update monthly limit or alert webhook URL for a user budget.
      operationId: update_budget_api_v1_budgets__budget_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: budget_id
        in: path
        required: true
        schema:
          type: string
          title: Budget Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Budgets
      summary: Delete budget
      description: Delete a budget owned by the authenticated user.
      operationId: delete_budget_api_v1_budgets__budget_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: budget_id
        in: path
        required: true
        schema:
          type: string
          title: Budget Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/reports/summary:
    get:
      tags:
      - Reports
      summary: Get spend summary report
      description: Compute category totals, top 10 merchants, month-over-month spend
        delta, and daily spend series.
      operationId: get_summary_api_v1_reports_summary_get
      security:
      - HTTPBearer: []
      parameters:
      - name: from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Start date (YYYY-MM-DD)
          examples:
          - '2025-01-01'
          title: From
        description: Start date (YYYY-MM-DD)
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: End date (YYYY-MM-DD)
          examples:
          - '2025-01-31'
          title: To
        description: End date (YYYY-MM-DD)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryReport'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/users:
    get:
      tags:
      - Admin
      summary: List all users
      description: Administrative endpoint to view all registered users. Requires
        'admin' role.
      operationId: list_users_api_v1_admin_users_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegisterResponse'
                title: Response List Users Api V1 Admin Users Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/register:
    post:
      tags:
