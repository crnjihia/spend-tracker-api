[tool.poetry]
name = "spend-tracker-api"
version = "0.1.0"
description = "Personal finance tracking REST API built for Kenyan spending habits"
authors = ["Antigravity <dev@matumizi.co.ke>"]
license = "MIT"
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
fastapi = ">=0.110.0"
uvicorn = {extras = ["standard"], version = ">=0.27.0"}
sqlalchemy = {version = ">=2.0.28", extras = ["asyncio"]}
greenlet = ">=3.0.0"
asyncpg = ">=0.29.0"
alembic = ">=1.13.0"
pydantic = ">=2.6.0"
pydantic-settings = ">=2.2.0"
python-jose = {extras = ["cryptography"], version = ">=3.3.0"}
passlib = {extras = ["bcrypt"], version = ">=1.7.4"}
bcrypt = ">=4.1.0"
httpx = ">=0.27.0"
structlog = ">=24.1.0"
slowapi = ">=0.1.8"
redis = ">=5.0.0"
email-validator = ">=2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.1.0"
pytest-asyncio = ">=0.23.0"
pytest-cov = ">=5.0.0"
aiosqlite = ">=0.20.0"
fakeredis = ">=2.20.0"
ruff = ">=0.3.0"
mypy = ">=1.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/db/seed.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
