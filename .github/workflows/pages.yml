name: Deploy Documentation & Coverage to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    env:
      JWT_SECRET_KEY: docs-ci-jwt-secret-key-32-chars-minimum
      DISABLE_SQLALCHEMY_CEXT: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run Test Suite and Generate HTML Coverage
        run: |
          poetry run pytest --cov=app --cov-report=html:docs/coverage --cov-report=xml --cov-report=term-missing

      - name: Export OpenAPI Specs & Documentation Portal (Swagger, ReDoc, Index)
        run: |
          poetry run python scripts/export_docs.py

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
